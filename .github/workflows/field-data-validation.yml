name: Field Data validation
on:
  pull_request:
  push:
    branches: [main, agent/use-supabase-backend]
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS URL of the deployed Field Data system
        required: true
        type: string
      test_backup:
        description: Queue and download an encrypted backup
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        schema: [public, field_data]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: field_data_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: central/server
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: field_data_test
      PGOPTIONS: '-c search_path=${{ matrix.schema }}'
      TEST_SCHEMA: '${{ matrix.schema }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: central/server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test test/field-data-hardening.test.js test/field-data/hardening.cjs
      - run: node test/field-data-migration-check.js

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Test live Cloudflare and Supabase services
        env:
          LIVE_BASE_URL: ${{ inputs.base_url }}
          LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
          LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
          LIVE_TEST_BACKUP: ${{ inputs.test_backup }}
        run: node cloudflare/live-smoke-test.mjs
