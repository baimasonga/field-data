name: Full stability validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-integration:
    name: Server integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: central/server
    env:
      PGPASSWORD: jubilant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: central/server/package-lock.json
      - name: Install server dependencies
        run: npm install --include=dev --no-audit --no-fund --ignore-scripts --engine-strict=false --force
      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE USER jubilant WITH PASSWORD 'jubilant' SUPERUSER;
          CREATE DATABASE jubilant_test OWNER jubilant;
          SQL
          psql -h 127.0.0.1 -U jubilant -d jubilant_test -v ON_ERROR_STOP=1             -c "CREATE EXTENSION IF NOT EXISTS pgrowlocks"
      - name: Write test configuration
        run: |
          mkdir -p config
          cat > config/test.json <<'JSON'
          {
            "default": {
              "database": {
                "host": "127.0.0.1",
                "port": 5432,
                "user": "jubilant",
                "password": "jubilant",
                "database": "jubilant_test"
              },
              "server": { "port": 8383 },
              "email": {
                "serviceAccount": "no-reply@fielddata.local",
                "transport": "json"
              },
              "xlsform": { "host": "localhost", "port": 5001 },
              "enketo": {
                "url": "http://localhost:8005/-",
                "apiKey": "enketorules"
              },
              "env": {
                "domain": "http://localhost:8383",
                "sysadminAccount": "admin@fielddata.quantixsl.com"
              },
              "external": { "sentry": {}, "analytics": {} }
            }
          }
          JSON
      - name: Migrate test database
        run: |
          NODE_CONFIG_DIR=../../config NODE_CONFIG_ENV=test             ./node_modules/.bin/knex migrate:latest --knexfile lib/model/knexfile.js
      - name: Verify test database connection
        run: |
          psql -h 127.0.0.1 -U jubilant -d jubilant_test -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), current_user, COUNT(*) AS migrations FROM knex_migrations"
      - name: Run server integration baseline
        id: server_tests
        continue-on-error: true
        run: |
          set -o pipefail
          NODE_ENV=test NODE_CONFIG_DIR=./config NODE_CONFIG_ENV=test BCRYPT=insecure npx mocha --recursive --bail --timeout 10000 test/integration 2>&1 | tee server-integration.log
      - name: Upload server integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-integration-log
          path: central/server/server-integration.log
          if-no-files-found: error
      - name: Enforce server result
        if: steps.server_tests.outcome == 'failure'
        run: exit 1

  client-karma:
    if: github.event_name == 'workflow_dispatch'
    name: Client Karma suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: central/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: central/client/package-lock.json
      - name: Install client dependencies
        run: npm ci --no-audit --no-fund
      - name: Run client baseline
        id: client_tests
        continue-on-error: true
        run: |
          set -o pipefail
          cp index.html public/
          cd apps/central
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"             NODE_ENV=test npx karma start karma.nosandbox.js 2>&1 | tee ../../client-karma.log
      - name: Upload client Karma log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-karma-log
          path: central/client/client-karma.log
          if-no-files-found: error
      - name: Enforce client result
        if: steps.client_tests.outcome == 'failure'
        run: exit 1
