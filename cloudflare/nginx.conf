server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 100m;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/v[0-9]+ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8383;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_read_timeout 10m;
  }

  # Backward-compatible redirects for historical Enketo URLs. They now
  # resolve to the bundled Field Data Web Forms application.
  location ~ ^/(?:-|enketo-passthrough)/preview/([:A-Za-z0-9]+)$ {
    return 302 /f/$1/preview$is_args$args;
  }

  location ~ ^/(?:-|enketo-passthrough)/single/([:A-Za-z0-9]+)$ {
    return 302 /f/$1$is_args$args;
  }

  location ~ ^/(?:-|enketo-passthrough)/x/([:A-Za-z0-9]+)$ {
    return 302 /f/$1/offline$is_args$args;
  }

  location ~ ^/(?:-|enketo-passthrough)/([:A-Za-z0-9]+)$ {
    return 302 /f/$1/new$is_args$args;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
