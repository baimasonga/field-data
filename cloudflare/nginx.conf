# The client is two applications, not one. Filling in a form, previewing a
# draft and editing a submission are served by the Web Forms app at
# /apps/forms/index.html; everything else is served by the management app at
# /index.html. Falling back to /index.html for every unmatched path -- which is
# what this did -- hands those URLs to the app that has no routes for them, and
# the reader gets "Page Not Found" on a page that exists.
#
# The pattern is upstream's, kept identical so the two stay in step.
map $request_uri $spa_name {
  ~^/(?:f/[^/]+(?:/.*)?|projects/\d+/forms/[^/]+/(?:(?:draft/)?(?:preview|submissions/new(?:/offline)?)|submissions/[^/]+/edit)(?:/)?)(?:\?.*)?$
    form-wrapper;
  default
    root-app;
}
map $spa_name $spa_html {
  form-wrapper "/apps/forms/index.html";
  default      "/index.html";
}

# The app's HTML must be checked with the server on every visit: it names the
# script bundles of one deploy, and a browser that keeps an old copy keeps
# showing the app as it was, without any feature deployed since. no-cache still
# lets the browser reuse its copy when nginx answers "not modified". Bundles
# have hashed names and need no header. Set at server level so the security
# headers below are not dropped (nginx does not merge add_header across levels).
map $sent_http_content_type $field_data_cache_control {
  ~^text/html "no-cache";
  default     "";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 100m;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cache-Control $field_data_cache_control always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/v[0-9]+ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8383;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_read_timeout 10m;
  }

  # Backward-compatible redirects for historical Enketo URLs. They now
  # resolve to the bundled Field Data Web Forms application.
  location ~ ^/(?:-|enketo-passthrough)/preview/([:A-Za-z0-9]+)$ {
    return 302 /f/$1/preview$is_args$args;
  }

  location ~ ^/(?:-|enketo-passthrough)/single/([:A-Za-z0-9]+)$ {
    return 302 /f/$1$is_args$args;
  }

  location ~ ^/(?:-|enketo-passthrough)/x/([:A-Za-z0-9]+)$ {
    return 302 /f/$1/offline$is_args$args;
  }

  location ~ ^/(?:-|enketo-passthrough)/([:A-Za-z0-9]+)$ {
    return 302 /f/$1/new$is_args$args;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ $spa_html;
  }
}
